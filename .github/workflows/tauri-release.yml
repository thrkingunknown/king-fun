name: Tauri release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (example: v1.0.1). Leave empty to use package.json version as v<version>.'
        required: false
        type: string
      draft:
        description: 'Create a draft GitHub Release'
        required: false
        default: true
        type: boolean
      prerelease:
        description: 'Mark the GitHub Release as prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
      draft: ${{ inputs.draft }}
      prerelease: ${{ inputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then tag="${{ inputs.tag }}"; else version=$(node -p "require('./package.json').version"); tag="v${version}"; fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "name=KING-FUN ${tag}" >> "$GITHUB_OUTPUT"

  android:
    name: Build and publish Android
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      VITE_KING_FUN_API_URL: ${{ secrets.VITE_KING_FUN_API_URL }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Require packaged-app API URL
        shell: bash
        run: |
          if [ -z "$VITE_KING_FUN_API_URL" ]; then
            echo "::error::Set the VITE_KING_FUN_API_URL repository secret before publishing Android artifacts."
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK/NDK components
        run: sdkmanager --install "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0"
      - run: bun install --frozen-lockfile
      - name: Initialize Android project if missing
        shell: bash
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            bun run tauri android init --ci
          fi
      - name: Restore Android signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          mkdir -p src-tauri/gen/android
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/king-fun-upload.jks"
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/king-fun-upload.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Build Android bundles
        run: bun run tauri android build --ci
      - name: Publish Android artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.name }}
          draft: ${{ needs.prepare.outputs.draft }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          files: |
            src-tauri/gen/android/**/outputs/**/*.apk
            src-tauri/gen/android/**/outputs/**/*.aab
            src-tauri/gen/android/**/*.apk
            src-tauri/gen/android/**/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
