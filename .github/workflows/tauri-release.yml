name: Tauri release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (example: v1.0.1). Leave empty to use package.json version as v<version>.'
        required: false
        type: string
      draft:
        description: 'Create a draft GitHub Release'
        required: false
        default: true
        type: boolean
      prerelease:
        description: 'Mark the GitHub Release as prerelease'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
      draft: ${{ inputs.draft }}
      prerelease: ${{ inputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then tag="${{ inputs.tag }}"; else version=$(node -p "require('./package.json').version"); tag="v${version}"; fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "name=KING-FUN ${tag}" >> "$GITHUB_OUTPUT"

  android:
    name: Build and publish Android
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      VITE_KING_FUN_API_URL: ${{ secrets.VITE_KING_FUN_API_URL }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Require packaged-app API URL
        shell: bash
        run: |
          if [ -z "$VITE_KING_FUN_API_URL" ]; then
            echo "::error::Set the VITE_KING_FUN_API_URL repository secret before publishing Android artifacts."
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android SDK/NDK components
        run: sdkmanager --install "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0"
      - name: Cache Rust and Gradle dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-android-release-${{ hashFiles('src-tauri/Cargo.lock', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-release-${{ hashFiles('src-tauri/Cargo.lock', 'bun.lock') }}-
            ${{ runner.os }}-android-release-
      - run: bun install --frozen-lockfile
      - name: Initialize Android project if missing
        shell: bash
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            bun run tauri android init --ci
          fi
      - name: Configure Android compiler warnings
        shell: bash
        run: |
          {
            echo 'android.javaCompile.suppressSourceTargetDeprecationWarning=true'
            echo 'android.sync.suppressAGPWarnings=JAVA_COMPILE_DEPRECATED_SOURCE_TARGET'
          } >> src-tauri/gen/android/gradle.properties
          props=src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
          if [ -f "$props" ]; then
            if grep -q '^networkTimeout=' "$props"; then
              sed -i 's/^networkTimeout=.*/networkTimeout=300000/' "$props"
            else
              echo 'networkTimeout=300000' >> "$props"
            fi
          fi
      - name: Read Gradle version
        id: gradle
        shell: bash
        run: |
          props=src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
          url=$(grep '^distributionUrl=' "$props" | sed 's/^distributionUrl=//' | sed 's#\\:#:#g' | sed 's#\\/#/#g')
          file=$(basename "$url")
          version="${file#gradle-}"; version="${version%-bin.zip}"; version="${version%-all.zip}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "file=${file}" >> "$GITHUB_OUTPUT"
      - name: Prefetch Gradle distribution
        shell: bash
        working-directory: src-tauri/gen/android
        env:
          GH_TOKEN: ${{ github.token }}
          GRADLE_VERSION: ${{ steps.gradle.outputs.version }}
          GRADLE_FILE: ${{ steps.gradle.outputs.file }}
        run: |
          set -euo pipefail
          props=gradle/wrapper/gradle-wrapper.properties
          file="$GRADLE_FILE"
          version="$GRADLE_VERSION"
          cache_dir="$RUNNER_TEMP/gradle-dist"
          mkdir -p "$cache_dir"
          zip="$cache_dir/$file"
          find_cached() {
            local found
            found=$(find "$HOME/.gradle/wrapper/dists" -type f -name "$file" 2>/dev/null | head -n 1 || true)
            if [ -n "$found" ]; then cp "$found" "$zip"; return 0; fi
            found=$(find /usr/share/gradle -type f -name "$file" 2>/dev/null | head -n 1 || true)
            if [ -n "$found" ]; then cp "$found" "$zip"; return 0; fi
            return 1
          }
          ok=1
          if [ -f "$zip" ] || find_cached; then ok=0; fi
          if [ "$ok" -ne 0 ]; then
            echo "Downloading Gradle distribution via gh: gradle/gradle-distributions v${version} ${file}"
            if gh release download "v${version}" --repo gradle/gradle-distributions --pattern "$file" --dir "$cache_dir" --clobber 2>/dev/null; then
              ok=0
            fi
          fi
          if [ "$ok" -ne 0 ]; then
            for candidate in \
              "https://github.com/gradle/gradle-distributions/releases/download/v${version}/${file}" \
              "https://downloads.gradle.org/distributions/${file}" \
              "https://services.gradle.org/distributions/${file}"
            do
              echo "Downloading Gradle distribution: $candidate"
              if curl -fL --retry 2 --retry-delay 10 --connect-timeout 30 --max-time 900 -o "$zip.part" "$candidate" 2>/dev/null; then
                mv "$zip.part" "$zip"
                ok=0
                break
              fi
              rm -f "$zip.part"
            done
          fi
          if [ "$ok" -ne 0 ] && find_cached; then ok=0; fi
          if [ "$ok" -ne 0 ]; then
            echo "::warning::Could not obtain Gradle ${version} zip; attempting wrapper/provisioned Gradle with extended timeout."
          else
            escaped="file\\:${zip//\//\\/}"
            if grep -q '^distributionUrl=' "$props"; then
              sed -i "s#^distributionUrl=.*#distributionUrl=${escaped}#" "$props"
            else
              echo "distributionUrl=${escaped}" >> "$props"
            fi
          fi
          export GRADLE_OPTS="${GRADLE_OPTS:-} -Dorg.gradle.wrapper.networkTimeout=300000"
          for attempt in 1 2 3 4 5; do
            if ./gradlew --version; then exit 0; fi
            echo "Gradle wrapper verification attempt ${attempt} failed; retrying..."
            sleep $((attempt * 15))
          done
          exit 1
      - name: Generate KING-FUN Android launcher icons
        shell: bash
        run: |
          bun run tauri icon frontend/public/king-fun-logo-source.svg
          resource_dir=src-tauri/gen/android/app/src/main/res
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for icon in ic_launcher.png ic_launcher_round.png ic_launcher_foreground.png; do
              file="$resource_dir/mipmap-$density/$icon"
              if [ ! -s "$file" ]; then
                echo "::error::Tauri icon generation did not create $file"
                exit 1
              fi
            done
          done
      - name: Configure and validate Android release signing
        shell: bash
        run: bun run scripts/configure-android-release-signing.mjs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Build Android bundles
        shell: bash
        run: |
          for attempt in 1 2; do
            if bun run tauri android build --ci; then exit 0; fi
            echo "Android build attempt ${attempt} failed; retrying once..."
            sleep 20
          done
          exit 1
      - name: Verify signatures and stage installable Android artifacts
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          release_dir=release-artifacts
          mkdir -p "$release_dir"
          keystore="$RUNNER_TEMP/king-fun-upload-keystore.jks"
          if [ ! -s "$keystore" ]; then
            echo "::error::The validated Android release keystore is missing from the runner temp directory."
            exit 1
          fi
          expected_fingerprint=$(keytool -list -v -keystore "$keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" 2>/dev/null | awk '/SHA256:/ { gsub(/:/, "", $2); print tolower($2); exit }')
          if [ -z "$expected_fingerprint" ]; then
            echo "::error::Could not read the configured release certificate SHA-256 fingerprint."
            exit 1
          fi

          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if [ ! -x "$apksigner" ]; then
            echo "::error::Android apksigner was not installed at the expected build-tools path."
            exit 1
          fi

          apk_count=0
          while IFS= read -r -d '' apk; do
            echo "Verifying APK signature and release-certificate identity: $(basename "$apk")"
            apk_verify_log=$("$apksigner" verify --verbose --print-certs "$apk" 2>&1) || {
              printf '%s\n' "$apk_verify_log"
              echo "::error::APK signature verification failed."
              exit 1
            }
            printf '%s\n' "$apk_verify_log"
            apk_fingerprint=$(awk '/Signer #1 certificate SHA-256 digest:/ { print tolower($NF); exit }' <<<"$apk_verify_log")
            if [ -z "$apk_fingerprint" ] || [ "$apk_fingerprint" != "$expected_fingerprint" ]; then
              echo "::error::APK was not signed with the configured KING-FUN release key."
              exit 1
            fi
            cp "$apk" "$release_dir/KING-FUN-${RELEASE_TAG}-$(basename "$apk")"
            apk_count=$((apk_count + 1))
          done < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*-release.apk' ! -name '*-unsigned.apk' -print0 2>/dev/null | sort -z)

          if [ "$apk_count" -eq 0 ]; then
            echo "::error::No signed APK was produced. Unsigned APKs are deliberately excluded from GitHub Releases."
            find src-tauri/gen/android/app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi

          aab_count=0
          while IFS= read -r -d '' bundle; do
            echo "Verifying AAB signature: $(basename "$bundle")"
            verify_log=$(jarsigner -verify -verbose "$bundle" 2>&1) || {
              printf '%s\n' "$verify_log"
              echo "::error::AAB signature verification failed."
              exit 1
            }
            if ! grep -qi 'jar verified' <<<"$verify_log" || grep -qi 'jar is unsigned' <<<"$verify_log"; then
              printf '%s\n' "$verify_log"
              echo "::error::AAB is not signed; refusing to publish it."
              exit 1
            fi
            aab_fingerprint=$(keytool -printcert -jarfile "$bundle" 2>/dev/null | awk '/SHA256:/ { gsub(/:/, "", $2); print tolower($2); exit }')
            if [ -z "$aab_fingerprint" ] || [ "$aab_fingerprint" != "$expected_fingerprint" ]; then
              echo "::error::AAB was not signed with the configured KING-FUN release key."
              exit 1
            fi
            cp "$bundle" "$release_dir/KING-FUN-${RELEASE_TAG}-$(basename "$bundle")"
            aab_count=$((aab_count + 1))
          done < <(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*release*.aab' ! -iname '*intermediary*' -print0 2>/dev/null | sort -z)

          if [ "$aab_count" -eq 0 ]; then
            echo "::error::No signed application AAB was produced."
            find src-tauri/gen/android/app/build/outputs -type f -name '*.aab' -print || true
            exit 1
          fi

          {
            echo '### Verified Android release artifacts'
            echo
            echo "- Signed APKs: $apk_count"
            echo "- Signed AABs: $aab_count"
            echo '- Unsigned APKs and intermediary bundles are excluded.'
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh "$release_dir"
      - name: Remove stale APK/AAB assets from an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          asset_list="$RUNNER_TEMP/${RELEASE_TAG//[^A-Za-z0-9._-]/_}-existing-assets.txt"
          if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' > "$asset_list" 2>/dev/null; then
            while IFS= read -r asset; do
              case "$asset" in
                *.apk|*.aab)
                  echo "Removing previously published Android package before replacing it with verified artifacts: $asset"
                  gh release delete-asset "$RELEASE_TAG" "$asset" --yes
                  ;;
              esac
            done < "$asset_list"
          else
            echo "No existing GitHub Release assets to clean for $RELEASE_TAG."
          fi
      - name: Publish Android artifacts to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.name }}
          draft: ${{ needs.prepare.outputs.draft }}
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
