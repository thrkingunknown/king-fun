name: Tauri Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android
    runs-on: ubuntu-24.04
    env:
      VITE_KING_FUN_API_URL: ${{ secrets.VITE_KING_FUN_API_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Require packaged-app API URL
        shell: bash
        run: |
          if [ -z "$VITE_KING_FUN_API_URL" ]; then
            echo "::error::Set the VITE_KING_FUN_API_URL repository secret before building Android packages."
            exit 1
          fi

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Rust and Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-android-${{ hashFiles('src-tauri/Cargo.lock', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-${{ hashFiles('src-tauri/Cargo.lock', 'bun.lock') }}-
            ${{ runner.os }}-android-

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Initialize Android project if missing
        shell: bash
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            bun run tauri android init --ci
          fi

      - name: Configure Android compiler warnings
        shell: bash
        run: |
          {
            echo 'android.javaCompile.suppressSourceTargetDeprecationWarning=true'
            echo 'android.sync.suppressAGPWarnings=JAVA_COMPILE_DEPRECATED_SOURCE_TARGET'
          } >> src-tauri/gen/android/gradle.properties

      - name: Build Android arm64 bundles
        run: bun run tauri android build --ci --target aarch64

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tauri-android
          if-no-files-found: error
          path: |
            src-tauri/gen/android/**/outputs/**
            src-tauri/gen/android/**/*.apk
            src-tauri/gen/android/**/*.aab
