name: Tauri Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android
    runs-on: ubuntu-24.04
    env:
      VITE_KING_FUN_API_URL: ${{ secrets.VITE_KING_FUN_API_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Require packaged-app API URL
        shell: bash
        run: |
          if [ -z "$VITE_KING_FUN_API_URL" ]; then
            echo "::error::Set the VITE_KING_FUN_API_URL repository secret before building Android packages."
            exit 1
          fi

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Rust and Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-android-${{ hashFiles('src-tauri/Cargo.lock', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-${{ hashFiles('src-tauri/Cargo.lock', 'bun.lock') }}-
            ${{ runner.os }}-android-

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Initialize Android project if missing
        shell: bash
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            bun run tauri android init --ci
          fi

      - name: Configure Android compiler warnings
        shell: bash
        run: |
          {
            echo 'android.javaCompile.suppressSourceTargetDeprecationWarning=true'
            echo 'android.sync.suppressAGPWarnings=JAVA_COMPILE_DEPRECATED_SOURCE_TARGET'
          } >> src-tauri/gen/android/gradle.properties
          props=src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
          if [ -f "$props" ]; then
            if grep -q '^networkTimeout=' "$props"; then
              sed -i 's/^networkTimeout=.*/networkTimeout=300000/' "$props"
            else
              echo 'networkTimeout=300000' >> "$props"
            fi
          fi

      - name: Read Gradle version
        id: gradle
        shell: bash
        run: |
          props=src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
          url=$(grep '^distributionUrl=' "$props" | sed 's/^distributionUrl=//' | sed 's#\\:#:#g' | sed 's#\\/#/#g')
          file=$(basename "$url")
          version="${file#gradle-}"; version="${version%-bin.zip}"; version="${version%-all.zip}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "file=${file}" >> "$GITHUB_OUTPUT"

      - name: Prefetch Gradle distribution
        shell: bash
        working-directory: src-tauri/gen/android
        env:
          GH_TOKEN: ${{ github.token }}
          GRADLE_VERSION: ${{ steps.gradle.outputs.version }}
          GRADLE_FILE: ${{ steps.gradle.outputs.file }}
        run: |
          set -euo pipefail
          props=gradle/wrapper/gradle-wrapper.properties
          file="$GRADLE_FILE"
          version="$GRADLE_VERSION"
          cache_dir="$RUNNER_TEMP/gradle-dist"
          mkdir -p "$cache_dir"
          zip="$cache_dir/$file"
          find_cached() {
            local found
            found=$(find "$HOME/.gradle/wrapper/dists" -type f -name "$file" 2>/dev/null | head -n 1 || true)
            if [ -n "$found" ]; then cp "$found" "$zip"; return 0; fi
            found=$(find /usr/share/gradle -type f -name "$file" 2>/dev/null | head -n 1 || true)
            if [ -n "$found" ]; then cp "$found" "$zip"; return 0; fi
            return 1
          }
          ok=1
          if [ -f "$zip" ] || find_cached; then ok=0; fi
          if [ "$ok" -ne 0 ]; then
            echo "Downloading Gradle distribution via gh: gradle/gradle-distributions v${version} ${file}"
            if gh release download "v${version}" --repo gradle/gradle-distributions --pattern "$file" --dir "$cache_dir" --clobber 2>/dev/null; then
              ok=0
            fi
          fi
          if [ "$ok" -ne 0 ]; then
            for candidate in \
              "https://github.com/gradle/gradle-distributions/releases/download/v${version}/${file}" \
              "https://downloads.gradle.org/distributions/${file}" \
              "https://services.gradle.org/distributions/${file}"
            do
              echo "Downloading Gradle distribution: $candidate"
              if curl -fL --retry 2 --retry-delay 10 --connect-timeout 30 --max-time 900 -o "$zip.part" "$candidate" 2>/dev/null; then
                mv "$zip.part" "$zip"
                ok=0
                break
              fi
              rm -f "$zip.part"
            done
          fi
          if [ "$ok" -ne 0 ] && find_cached; then ok=0; fi
          if [ "$ok" -ne 0 ]; then
            echo "::warning::Could not obtain Gradle ${version} zip; attempting wrapper/provisioned Gradle with extended timeout."
          else
            escaped="file\\:${zip//\//\\/}"
            if grep -q '^distributionUrl=' "$props"; then
              sed -i "s#^distributionUrl=.*#distributionUrl=${escaped}#" "$props"
            else
              echo "distributionUrl=${escaped}" >> "$props"
            fi
          fi
          export GRADLE_OPTS="${GRADLE_OPTS:-} -Dorg.gradle.wrapper.networkTimeout=300000"
          for attempt in 1 2 3 4 5; do
            if ./gradlew --version; then exit 0; fi
            echo "Gradle wrapper verification attempt ${attempt} failed; retrying..."
            sleep $((attempt * 15))
          done
          exit 1

      - name: Build Android arm64 bundles
        shell: bash
        run: |
          for attempt in 1 2; do
            if bun run tauri android build --ci --target aarch64; then exit 0; fi
            echo "Android build attempt ${attempt} failed; retrying once..."
            sleep 20
          done
          exit 1

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tauri-android
          if-no-files-found: error
          path: |
            src-tauri/gen/android/**/outputs/**
            src-tauri/gen/android/**/*.apk
            src-tauri/gen/android/**/*.aab
