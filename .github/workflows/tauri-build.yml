name: Tauri build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
          - platform: macos-15
          - platform: windows-2022
    runs-on: ${{ matrix.platform }}
    env:
      VITE_KING_FUN_API_URL: ${{ vars.VITE_KING_FUN_API_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4

      - name: Require packaged-app API URL
        shell: bash
        run: |
          if [ -z "$VITE_KING_FUN_API_URL" ]; then
            echo "::error::Set the VITE_KING_FUN_API_URL repository variable before building Tauri packages."
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend assets
        run: bun run --filter @king-fun/frontend build

      - name: Build Tauri bundles
        run: bun run tauri build --ci

      - name: Upload Tauri bundles
        uses: actions/upload-artifact@v7.0.2
        with:
          name: tauri-bundles-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/release/*.exe
            src-tauri/target/release/*.msi
