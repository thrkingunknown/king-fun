name: Quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Repository policy, lint, typecheck, tests, and build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install exact locked workspace dependencies
        run: bun install --frozen-lockfile

      - name: Run complete quality pipeline
        run: bun run check

      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium

      - name: Run responsive browser and axe tests
        run: bun run test:e2e
